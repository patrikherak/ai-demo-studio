<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>stage</title>
<script src="../shared/icons.js"></script>
<style>
:root {
  --bg: var(--brand-bg, #f4f4f1);
  --ink: var(--brand-ink, #16181d);
  --muted: var(--brand-muted, #676d73);
  --primary: var(--brand-primary, #2563eb);
  --accent-2: var(--brand-accent-2, #0f766e);
  --accent-3: var(--brand-accent-3, #b45309);
  --tint-1: var(--brand-tint-1, #eef2ff);
  --tint-2: var(--brand-tint-2, #ecfdf5);
  --tint-3: var(--brand-tint-3, #fff7ed);
  --surface: var(--brand-surface, #ffffff);
  --dark: var(--brand-dark, #16181d);
  --heading: var(--brand-font-heading, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  --body: var(--brand-font-body, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--body); -webkit-font-smoothing: antialiased; }
body.dark { background: radial-gradient(1300px 900px at 80% 8%, color-mix(in srgb, var(--primary) 34%, var(--dark)) 0%, transparent 72%), radial-gradient(1000px 800px at 6% 104%, color-mix(in srgb, var(--primary) 14%, var(--dark)) 0%, transparent 70%), var(--dark); color: #fff; --muted: rgba(255,255,255,.68); }
body.dark .backdrop { display: none; }
.backdrop { position: absolute; inset: 0; overflow: hidden; }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .6; }
.blob.a { width: 820px; height: 820px; right: -200px; top: -300px; background: var(--tint-1); }
.blob.b { width: 680px; height: 680px; left: -240px; bottom: -300px; background: var(--tint-2); }
.blob.c { width: 460px; height: 460px; right: 16%; bottom: -260px; background: var(--tint-3); opacity: .5; }
body.dark .blob { opacity: .2; }
body.dark .blob.a { background: var(--primary); }
body.dark .blob.b { background: var(--accent-2); opacity: .14; }
body.dark .blob.c { background: var(--primary); opacity: .1; }
#fg { position: absolute; inset: 0; }
.device { position: absolute; transform-origin: 50% 50%; will-change: transform; }
.window { background: var(--surface); border-radius: 18px; overflow: hidden; box-shadow: 0 50px 110px -34px rgba(18, 22, 20, .42), 0 0 0 1px rgba(18, 22, 20, .06); }
body.dark .window { box-shadow: 0 50px 120px -30px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .08); }
.chrome { height: 44px; display: flex; align-items: center; gap: 16px; padding: 0 18px; background: #fbfbfa; border-bottom: 1px solid rgba(0,0,0,.07); }
.dots { display: flex; gap: 8px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: #e2e2de; display: block; }
.address { flex: 1; max-width: 560px; margin: 0 auto; height: 28px; border-radius: 8px; background: #f0f0ed; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; color: #5d625f; letter-spacing: .01em; transform: translateX(-38px); }
.address svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.2; }
.screen { position: relative; overflow: hidden; background: #fff; }
.screen img { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.phone { background: #121413; border-radius: 64px; padding: 14px; box-shadow: 0 60px 120px -30px rgba(18, 22, 20, .5), inset 0 0 0 2px #2c302e; }
body.dark .phone { box-shadow: 0 60px 140px -30px rgba(0, 0, 0, .8), inset 0 0 0 2px #3a3f3c; }
.phone .screen { border-radius: 50px; }
.statusbar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; z-index: 2; font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; font-weight: 600; }
.statusbar .icons { display: flex; align-items: center; }
.statusbar svg { display: block; fill: currentColor; }
.island { position: absolute; left: 50%; border-radius: 999px; background: #0b0c0c; transform: translateX(-50%); z-index: 3; }
.viewport { position: absolute; left: 0; overflow: hidden; }
.homebar { position: absolute; left: 0; right: 0; bottom: 0; display: grid; place-items: center; z-index: 2; }
.homebar i { display: block; border-radius: 999px; background: #111; opacity: .85; }
.panel { position: absolute; }
.eyebrow { display: flex; align-items: center; gap: 14px; color: var(--primary); font-weight: 600; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 22px; }
.eyebrow::before { content: ""; width: 32px; height: 2px; background: currentColor; border-radius: 2px; }
.title { font-family: var(--heading); font-weight: 600; letter-spacing: -.03em; line-height: 1.04; font-size: var(--title-size, 66px); }
.title .word { display: inline-block; }
.title .accent { color: var(--primary); }
.text { margin-top: 24px; font-size: 25px; line-height: 1.5; color: var(--muted); }
.bullets { list-style: none; margin-top: 30px; display: flex; flex-direction: column; gap: 16px; }
.bullets li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; font-size: 24px; line-height: 1.4; }
.bullets li b { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--tint-1); color: var(--primary); margin-top: 1px; }
body.dark .bullets li b { background: rgba(255,255,255,.1); color: #fff; }
.bullets li b svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.band { position: absolute; left: 0; right: 0; text-align: center; }
.band .eyebrow { justify-content: center; margin-bottom: 14px; }
.band .title { font-size: var(--title-size, 46px); }
.callout { position: absolute; width: 400px; background: #fff; color: var(--ink); border-radius: 18px; padding: 20px 24px 22px; box-shadow: 0 30px 70px -20px rgba(18, 22, 20, .34), 0 0 0 1px rgba(18, 22, 20, .05); z-index: 5; }
.callout .tag { display: inline-block; padding: 6px 12px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 13px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; margin-bottom: 12px; }
.callout .tag.c2 { background: var(--accent-2); } .callout .tag.c3 { background: var(--accent-3); }
.callout h4 { font-family: var(--heading); font-size: 25px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
.callout p { margin-top: 6px; font-size: 19px; line-height: 1.45; color: #6b716e; }
.callout.chip { width: auto; max-width: 520px; display: flex; align-items: center; gap: 14px; padding: 14px 22px 14px 14px; border-radius: 18px; }
.callout.chip .ci { width: 44px; height: 44px; flex: none; border-radius: 13px; display: grid; place-items: center; background: var(--tint-1); color: var(--primary); }
.callout.chip.c2 .ci { background: var(--tint-2); color: var(--accent-2); }
.callout.chip.c3 .ci { background: var(--tint-3); color: var(--accent-3); }
.callout.chip .ci svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2.3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.callout.chip h4 { font-size: 23px; white-space: nowrap; }
.callout.chip p { margin-top: 2px; font-size: 17px; white-space: nowrap; }
.ripple { position: absolute; border-radius: 50%; border: 3px solid var(--primary); pointer-events: none; z-index: 4; }
</style>
</head>
<body>
<div class="backdrop"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div></div>
<div id="fg"></div>
<script>
const S = window.__STAGE__;
const W = S.canvas.width, H = S.canvas.height;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const rich = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="accent">$1</span>');
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7.5"/></svg>';
const LOCK = '<svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const cfg = S.stage;
const vw = S.viewport.width, vh = S.viewport.height;
const fg = document.getElementById("fg");

if (S.brandCss) {
  const link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = S.brandCss;
  document.head.prepend(link);
}
if (cfg.vars) for (const [k, v] of Object.entries(cfg.vars)) document.documentElement.style.setProperty(k.startsWith("--") ? k : `--${k}`, v);
if (cfg.theme === "dark") document.body.classList.add("dark");
if (cfg.titleSize) document.documentElement.style.setProperty("--title-size", `${cfg.titleSize}px`);

function tokens(text) {
  const out = [];
  const re = /\*\*(.+?)\*\*|(\S+)/g;
  let m;
  while ((m = re.exec(String(text ?? "")))) {
    if (m[1]) for (const w of m[1].split(/\s+/)) out.push({ w, accent: true });
    else out.push({ w: m[2], accent: false });
  }
  return out;
}
const hasText = Boolean(cfg.eyebrow || cfg.title || cfg.text || cfg.bullets?.length);
const layout = cfg.layout ?? "browser";
const titleAt = cfg.titleAt ?? 0.25;
function panelHtml(cls, style) {
  const words = tokens(cfg.title);
  const textAt = titleAt + words.length * 0.07 + 0.15;
  return `<div class="${cls}" style="${style}">
    ${cfg.eyebrow ? `<div class="eyebrow" data-in="${Math.max(0, titleAt - 0.12)}">${esc(cfg.eyebrow)}</div>` : ""}
    ${cfg.title ? `<div class="title">${words.map((t, i) => `<span class="word${t.accent ? " accent" : ""}" data-in="${(titleAt + i * 0.07).toFixed(3)}" data-blur="1">${esc(t.w)}</span>`).join(" ")}</div>` : ""}
    ${cfg.text ? `<div class="text" data-in="${textAt.toFixed(3)}">${rich(cfg.text)}</div>` : ""}
    ${cfg.bullets?.length ? `<ul class="bullets">${cfg.bullets.map((b, i) => `<li data-in="${(typeof b === "object" && typeof b.at === "number") ? b.at : textAt + 0.2 + i * 0.14}"><b>${CHECK}</b><span>${rich(typeof b === "object" ? b.text : b)}</span></li>`).join("")}</ul>` : ""}
  </div>`;
}

let side = cfg.side ?? (hasText ? (layout === "phone" ? "right" : "right") : "center");
let device, scale;
const STATUS_ICONS = (u) => `<svg width="${18 * u}" height="${12 * u}" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
  <svg width="${16 * u}" height="${12 * u}" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0zM3.3 6.7a6.6 6.6 0 0 1 9.4 0l-1.5 1.5a4.5 4.5 0 0 0-6.4 0zM1 4.4a9.9 9.9 0 0 1 14 0l-1.5 1.5a7.8 7.8 0 0 0-11 0z"/></svg>
  <svg width="${27 * u}" height="${13 * u}" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2.2"/><path d="M24.5 4.5v4a2 2 0 0 0 0-4z" opacity=".45"/></svg>`;

if (layout === "phone") {
  const bezel = 14;
  const safe = cfg.safeArea !== false;
  const statusH = safe ? (cfg.statusBarHeight ?? 54) : 0;
  const homeH = safe ? (cfg.homeIndicatorHeight ?? 34) : 0;
  const phoneH = H - 2 * (cfg.marginY ?? 70);
  scale = (phoneH - 2 * bezel) / (vh + statusH + homeH);
  const phoneW = vw * scale + 2 * bezel;
  if (!hasText && side !== "left" && side !== "right") side = "center";
  const cx = side === "center" ? W / 2 : side === "right" ? W * (cfg.phoneX ?? 0.72) : W * (1 - (cfg.phoneX ?? 0.72));
  const left = Math.round(cx - phoneW / 2), top = Math.round((H - phoneH) / 2);
  const u = scale;
  const statusBg = cfg.statusBarColor ?? "#ffffff", statusInk = cfg.statusBarInk ?? "#111111", homeBg = cfg.homeIndicatorColor ?? statusBg;
  fg.insertAdjacentHTML("beforeend", `<div class="device phone" id="device" style="left:${left}px;top:${top}px;width:${phoneW}px;height:${phoneH}px">
    <div class="screen" style="width:${vw * u}px;height:${(vh + statusH + homeH) * u}px;background:${statusBg}">
      ${safe ? `<div class="statusbar" style="height:${statusH * u}px;padding:0 ${26 * u}px 0 ${34 * u}px;color:${statusInk};background:${statusBg};font-size:${16 * u}px"><span>${esc(cfg.statusTime ?? "9:41")}</span><span class="icons" style="gap:${6 * u}px">${STATUS_ICONS(u)}</span></div>
      <div class="island" style="top:${11 * u}px;width:${122 * u}px;height:${35 * u}px"></div>` : `<div class="island" style="top:${11 * u}px;width:${122 * u}px;height:${35 * u}px"></div>`}
      <div class="viewport" id="screen" style="top:${statusH * u}px;width:${vw * u}px;height:${vh * u}px"><img id="frame"></div>
      ${safe ? `<div class="homebar" style="height:${homeH * u}px;background:${homeBg}"><i style="width:${134 * u}px;height:${5 * u}px"></i></div>` : ""}
    </div></div>`);
  if (hasText && side !== "center") {
    const panelW = cfg.panelWidth ?? 760;
    const px = side === "right" ? 150 : W - 150 - panelW;
    fg.insertAdjacentHTML("beforeend", panelHtml("panel", `left:${px}px;top:0;width:${panelW}px;height:${H}px;display:flex;flex-direction:column;justify-content:center`));
  }
  device = { left, top, width: phoneW, height: phoneH };
} else {
  const chrome = cfg.chrome === false ? 0 : 44;
  const split = hasText && (side === "left" || side === "right");
  const band = hasText && !split ? (cfg.bandHeight ?? 200) : 0;
  const marginX = cfg.marginX ?? (split ? 90 : 120), marginY = cfg.marginY ?? (split ? 110 : 64);
  const panelW = split ? (cfg.panelWidth ?? 560) : 0;
  const gap = split ? 70 : 0;
  const availW = W - 2 * marginX - panelW - gap, availH = H - band - 2 * marginY + (band ? 24 : 0);
  scale = Math.min(availW / vw, (availH - chrome) / vh);
  const winW = vw * scale, winH = vh * scale + chrome;
  const left = split ? (side === "right" ? W - marginX - winW : marginX) : Math.round((W - winW) / 2);
  const top = Math.round(band + (H - band - winH) / 2 + (band ? -6 : 0));
  fg.insertAdjacentHTML("beforeend", `<div class="device window" id="device" style="left:${left}px;top:${top}px;width:${winW}px;height:${winH}px">
    ${chrome ? `<div class="chrome"><div class="dots"><i></i><i></i><i></i></div><div class="address">${LOCK}<span>${esc(cfg.url ?? "")}</span></div></div>` : ""}
    <div class="screen" id="screen" style="width:${winW}px;height:${vh * scale}px"><img id="frame"></div></div>`);
  if (band) fg.insertAdjacentHTML("beforeend", panelHtml("band", `top:${Math.round(marginY * 0.9)}px`));
  if (split) {
    const px = side === "right" ? marginX : W - marginX - panelW;
    fg.insertAdjacentHTML("beforeend", panelHtml("panel", `left:${px}px;top:0;width:${panelW}px;height:${H}px;display:flex;flex-direction:column;justify-content:center`));
  }
  device = { left, top, width: winW, height: winH };
}
device.side = side;

const img = document.getElementById("frame");
img.style.width = `${vw * scale}px`;
img.style.height = `${vh * scale}px`;
const deviceEl = document.getElementById("device");
const inEls = [...document.querySelectorAll("[data-in]")];

const tiltCfg = cfg.tilt === true ? {} : cfg.tilt || null;
const tiltSign = side === "left" ? 1 : side === "right" ? -1 : 1;
const tilt = tiltCfg ? { y: tiltSign * Math.abs(tiltCfg.y ?? (layout === "phone" ? 14 : 9)), x: tiltCfg.x ?? 5, z: tiltCfg.z ?? (layout === "phone" ? 2 : 0), drift: tiltCfg.drift ?? 0.45 } : null;

const zoomMax = cfg.zoom === "off" || cfg.zoom === false ? 1 : typeof cfg.zoom === "number" ? cfg.zoom : (layout === "phone" ? 1 : 1.45);
const focusKinds = new Set(cfg.zoomOn ?? ["click", "type", "focus"]);
const segments = [];
if (zoomMax > 1) {
  for (const e of S.events) {
    if (e.kind === "reset" || e.kind === "navigate") { if (segments.length) segments.at(-1).end = Math.min(segments.at(-1).end, e.t + 0.2); continue; }
    if (!focusKinds.has(e.kind) || !e.box) continue;
    const z = e.scale ?? zoomMax;
    const hold = (e.holdMs ?? (e.kind === "type" ? 2600 : 2000)) / 1000;
    const center = { x: e.box.x + e.box.width / 2, y: e.box.y + e.box.height / 2 };
    const last = segments.at(-1);
    if (last && e.t - last.end < 1.2) { last.points.push({ t: e.t, center, z }); last.end = Math.max(last.end, e.t + hold); }
    else segments.push({ start: e.t - 0.7, end: e.t + hold, points: [{ t: e.t, center, z }] });
  }
}
function cameraAt(t) {
  const neutral = { z: 1, cx: vw / 2, cy: vh / 2 };
  for (const seg of segments) {
    if (t < seg.start || t > seg.end + 0.8) continue;
    const inP = ease((t - seg.start) / 0.7);
    const outP = 1 - ease((t - seg.end) / 0.8);
    const k = Math.min(inP, t > seg.end ? outP : 1);
    let target = seg.points[0];
    for (let i = 1; i < seg.points.length; i++) {
      const p = seg.points[i];
      const move = ease((t - (p.t - 0.55)) / 0.55);
      if (move > 0) target = { z: target.z + (p.z - target.z) * move, center: { x: target.center.x + (p.center.x - target.center.x) * move, y: target.center.y + (p.center.y - target.center.y) * move } };
    }
    const z = 1 + (target.z - 1) * k;
    return { z, cx: neutral.cx + (target.center.x - neutral.cx) * k, cy: neutral.cy + (target.center.y - neutral.cy) * k };
  }
  return neutral;
}
function applyCamera(cam) {
  const viewW = vw / cam.z, viewH = vh / cam.z;
  const x0 = clamp(cam.cx - viewW / 2, 0, vw - viewW);
  const y0 = clamp(cam.cy - viewH / 2, 0, vh - viewH);
  img.style.transform = `translate(${-x0 * cam.z * scale}px, ${-y0 * cam.z * scale}px) scale(${cam.z})`;
  return { x0, y0, z: cam.z };
}

const callouts = (cfg.callouts === false ? [] : S.events.filter((e) => e.kind === "legend")).map((e, i) => {
  const el = document.createElement("div");
  const tone = ["", "c2", "c3"][(e.tone ?? i) % 3];
  if (e.style === "chip") {
    el.className = `callout chip ${tone}`;
    el.innerHTML = `<span class="ci">${window.demoIcon(e.icon ?? "check", "")}</span><span>${e.title ? `<h4>${rich(e.title)}</h4>` : ""}${e.text ? `<p>${rich(e.text)}</p>` : ""}</span>`;
  } else {
    el.className = "callout";
    el.innerHTML = `${e.tag ? `<span class="tag ${tone}">${esc(e.tag)}</span>` : ""}${e.title ? `<h4>${rich(e.title)}</h4>` : ""}${e.text ? `<p>${rich(e.text)}</p>` : ""}`;
  }
  fg.appendChild(el);
  const h = el.offsetHeight, w = el.offsetWidth;
  const pos = e.position ?? "bottom-right";
  const out = cfg.calloutOverhang ?? (layout === "phone" ? 34 : 70);
  const vertical = pos.startsWith("top") ? "top" : pos.startsWith("bottom") ? "bottom" : "middle";
  let horizontal = pos.endsWith("left") ? "left" : pos.endsWith("right") ? "right" : "center";
  if (layout === "phone" && horizontal === "center") horizontal = device.side === "right" ? "left" : "right";
  const outside = layout === "phone";
  let x;
  if (horizontal === "left") x = outside ? device.left - w + out : device.left - out;
  else if (horizontal === "right") x = outside ? device.left + device.width - out : device.left + device.width - w + out;
  else x = device.left + (device.width - w) / 2;
  let y;
  if (vertical === "top") y = device.top + (layout === "phone" ? 150 : 90);
  else if (vertical === "bottom") y = device.top + device.height - h - (layout === "phone" ? 150 : 50);
  else y = device.top + (device.height - h) / 2;
  x = clamp(x + (e.dx ?? 0), 40, W - w - 40); y = clamp(y + (e.dy ?? 0), 40, H - h - 40);
  el.style.left = `${x}px`; el.style.top = `${y}px`;
  return { el, start: e.t, end: e.t + (e.ms ?? 2600) / 1000, chip: e.style === "chip" };
});

const screenEl = document.getElementById("screen");
const ripples = S.events.filter((e) => e.kind === "click" && e.point).map((e) => {
  const el = document.createElement("div");
  el.className = "ripple";
  screenEl.appendChild(el);
  return { el, t: e.t, point: e.point };
});

let lastSrc = null;
window.__frame = async (t, total) => {
  const index = Math.min(S.frameCount, Math.max(1, Math.floor(t * S.fps) + 1));
  const src = `${S.framesUrl}/${String(index).padStart(6, "0")}.jpg`;
  if (src !== lastSrc) {
    img.src = src;
    await img.decode().catch(() => {});
    lastSrc = src;
  }
  const cam = applyCamera(cameraAt(t));
  const enter = easeOut(t / 0.7);
  const exit = cfg.exit === false ? 1 : clamp((total - t) / 0.35);
  let transform = `translateY(${(1 - enter) * 44 - (1 - exit) * 12}px) scale(${0.965 + 0.035 * enter})`;
  if (tilt) {
    const p = ease(t / Math.max(1, total));
    const drift = 1 + tilt.drift * (0.5 - p);
    transform = `perspective(2600px) ${transform} rotateY(${(tilt.y * drift * (0.6 + 0.4 * enter)).toFixed(3)}deg) rotateX(${(tilt.x * drift).toFixed(3)}deg) rotateZ(${tilt.z}deg)`;
  }
  deviceEl.style.opacity = String(Math.min(enter, exit));
  deviceEl.style.transform = transform;
  for (const el of inEls) {
    const p = easeOut((t - Number(el.dataset.in)) / 0.7);
    el.style.opacity = String(Math.min(p, exit));
    el.style.transform = `translateY(${(1 - p) * (el.dataset.blur ? 18 : 26)}px)`;
    if (el.dataset.blur) el.style.filter = `blur(${((1 - p) * 12).toFixed(2)}px)`;
  }
  for (const c of callouts) {
    const p = Math.min(easeOut((t - c.start) / 0.45), clamp((c.end - t) / 0.3), exit);
    const spring = c.chip ? 1 + Math.sin(clamp((t - c.start) / 0.45) * Math.PI) * 0.06 : 1;
    c.el.style.opacity = String(p);
    c.el.style.transform = `translateY(${(1 - p) * 18}px) scale(${((0.9 + 0.1 * p) * spring).toFixed(4)})`;
  }
  for (const r of ripples) {
    const p = (t - r.t) / 0.6;
    if (p < 0 || p > 1) { r.el.style.opacity = "0"; continue; }
    const at = { x: (r.point.x - cam.x0) * cam.z * scale, y: (r.point.y - cam.y0) * cam.z * scale };
    const size = 18 + 70 * easeOut(p);
    r.el.style.opacity = String((1 - p) * 0.9);
    r.el.style.width = r.el.style.height = `${size}px`;
    r.el.style.left = `${at.x - size / 2}px`;
    r.el.style.top = `${at.y - size / 2}px`;
  }
};
</script>
</body>
</html>
